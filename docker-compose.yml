services:
  gateway:
    build: ./microservices/gateway
    ports:
      - "3000:3000"
    depends_on:
      - orders
      - inventory
      - payments
      - notifications
    networks:
      - pizza-net

  orders:
    build: ./microservices/orders
    ports:
      - "3001:3001"
    depends_on:
      - inventory
      - payments
      - notifications
    networks:
      - pizza-net

  inventory:
    build: ./microservices/inventory
    ports:
      - "3002:3002"
    networks:
      - pizza-net

  payments:
    build: ./microservices/payments
    ports:
      - "3003:3003"
    networks:
      - pizza-net

  notifications:
    build: ./microservices/notifications
    ports:
      - "3004:3004"
    networks:
      - pizza-net

networks:
  pizza-net:
    driver: bridge
